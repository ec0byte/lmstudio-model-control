[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmc"
version = "0.1.0"
description = "Simple CLI to load/unload models on a local LM Studio server"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.9.0",
]

[project.scripts]
lmc = "lmc.cli:app"

[tool.setuptools.packages.find]
include = ["lmc*"]
